name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The core install: no extras, so neither geophysical model is available.
  # The QG and SWE tests must skip, not fail, which is what keeps the lazy
  # imports of pyteda.models honest.
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install . pytest
      - name: import pyteda without any extra
        run: |
          python -c "
          import pyteda
          from pyteda.models import available_models
          state = available_models()
          print(state)
          assert state['Lorenz96'] is True
          assert state['QGModel'] != True, 'the qg extra leaked into the core install'
          assert state['SWEModel'] != True, 'the swe extra leaked into the core install'
          "
      - run: python -m pytest tests -q

  # With both extras, pulling swesphere and qg-python from PyPI. This is also
  # the integration test of the two adapters against the published backends.
  extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[all]" pytest
      - name: report the backends in use
        run: |
          python -c "
          import qgpython, swesphere
          from pyteda.models import available_models
          print('qg-python', qgpython.__version__)
          print('swesphere', swesphere.__version__)
          assert all(v is True for v in available_models().values())
          "
      - run: python -m pytest tests -q
