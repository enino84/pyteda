[project]
name = "pyteda"
version = "0.6.0"
description = "TEDA: ensemble-based data assimilation methods, with toy and geophysical models through adapters"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  { name = "Elías D. Niño-Ruiz", email = "elias.d.nino@gmail.com" }
]
keywords = ["data assimilation", "EnKF", "education", "Lorenz96", "Python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "scikit-learn",
  "pandas",
  "xarray",
  "netCDF4"
]

[project.optional-dependencies]
# Geophysical models. pyteda does not implement them: each is an external
# package that pyteda adapts to the Model interface.
qg  = ["qg-python>=1.1.0"]      # QGModel  -> qgpython
swe = ["swesphere>=0.4.0"]      # SWEModel -> swesphere
parallel = ["joblib"]
all = ["qg-python>=1.1.0", "swesphere>=0.4.0", "joblib"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyteda*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::scipy.sparse.SparseEfficiencyWarning",
]
