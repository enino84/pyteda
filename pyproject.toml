[project]
name = "pyteda"
version = "0.3.0"
description = "TEDA: Toy models and ensemble-based Data Assimilation methods for education and experimentation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  { name = "Elías D. Niño-Ruiz", email = "elias.d.nino@gmail.com" }
]
keywords = ["data assimilation", "EnKF", "education", "Lorenz96", "Python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "scikit-learn",
  "pandas",
  "xarray",
  "netCDF4",
  "pyshtools"
]

[project.optional-dependencies]
parallel = ["joblib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyteda*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::scipy.sparse.SparseEfficiencyWarning",
]
